<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="gate.js?v=20261111c"></script>
  <title>Simulasi TKA · Ωwly</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=20261111c">
</head>
<body data-tka>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6h4.5"/></symbol>
    <symbol id="arrow-right" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></symbol>
  </defs>
</svg>

<div class="tka-page">
  <header class="tka-bar">
    <a class="tka-brand" href="index.html">
      <img src="logo.svg" alt="" width="26" height="24">
      <span>Ωwly</span>
    </a>
    <div class="tka-bar__mid">
      <b>Simulasi TKA</b>
      <small>30 Bahasa Indonesia · 25 Matematika · 70 menit</small>
    </div>
    <div class="tka-bar__right" data-tka-bar>
      <span class="tka-timer" data-timer>
        <svg class="icon"><use href="#clock"/></svg>
        <b data-sisa>70:00</b>
      </span>
      <button class="btn-act btn-act--red" type="button" data-kumpul><span>Kumpulkan</span></button>
      <a class="tka-quit" href="latihan.html" aria-label="Keluar dari simulasi">&times;</a>
    </div>
  </header>

  <main class="tka" id="tkaBody"></main>
</div>

<script src="soal.js?v=20261111c"></script>
<script src="tka.js?v=20261111c"></script>
<script src="simulasi.js?v=20261111c"></script>
</body>
</html>
